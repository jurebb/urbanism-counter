# Batch processing config
# Run: python batch_run.py batch.yaml
#
# Output structure:
#   output/
#     <video_name>/
#       <variant_name>/
#         video.mp4 + all supplements (heatmap.png, paths.png, counts.txt, ...)
#
# features_only: true  — skips full tracking, just outputs feature PNGs (fast)
# features_frame: N    — frame number to use for feature detection (default: 0)
#
# videos_dir: picks up all .mp4 files in that folder automatically.
# videos: optional per-video overrides (e.g. features_frame). Filenames must
#         match exactly what's in videos_dir. Unlisted videos use defaults.

output_dir: output/
max_parallel: 4

variants:
  - name: dwell_paths
    flags: [--heatmap, --dwell, --no-boxes, --no-counter, --paths]

  - name: paths
    flags: [--no-boxes, --no-counter, --paths]

  - name: features_seating
    flags: [--features, --features-filter, Seating]
    features_only: true

  - name: features_all
    flags: [--features, --features-filter, Seating, Bins, Lamps, Fountains]
    features_only: true

  - name: full
    flags: [--features, --features-filter, Seating, --heatmap, --dwell, --no-boxes, --no-counter, --paths]

  - name: poeple_tracker
    flags: []

videos_dir: ~/Documents/data/2parkscontrolbeh/test_batch/

# Optional per-video overrides — omit a video entirely to use defaults
videos:
  # todo: update
  - path: ~/Documents/data/2parkscontrolbeh/test_batch/6_Yamaguchi-Park-2-75fps.mp4 # update
    features_frame: 358 # update
